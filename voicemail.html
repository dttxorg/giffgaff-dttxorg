            <img src="./assets/avatar.jpg" alt="" width="46" height="46">

      <section class="hero-card reveal">

        <h1>关闭 <span class="accent">语音信箱</span></h1>
        <p class="hero-text">人在英国以外时，建议联系 giffgaff 客服手动关闭语音信箱，避免拒接电话后可能产生漫游扣费。</p>
      </section>

      <section class="tutorial-steps reveal-stagger">
        <article>
          <span>1</span>
          <div class="body">
            <h2>打开 Ask an Agent 页面</h2>
            <p><a href="https://support2.giffgaff.com/app/ask/International-and-Roaming/Accessing-voicemail-while-abroad/form/" target="_blank" rel="noopener">进入 giffgaff 客服表单</a>，登录你的 giffgaff 账户后继续。</p>
          </div>
        </article>
        <article>
          <span>2</span>
          <div class="body">
            <h2>发送关闭请求</h2>
            <p>可以把下面这段英文发给客服，点击英文可复制：</p>
            <button class="copy-text" type="button" data-copy="Hello, I am outside the UK. Please fully disable voicemail on my giffgaff account to avoid roaming charges, as I cannot turn it off myself from abroad. Thank you.">Hello, I am outside the UK. Please fully disable voicemail on my giffgaff account to avoid roaming charges, as I cannot turn it off myself from abroad. Thank you.</button>
            <p class="copy-tip" aria-live="polite"></p>
          </div>
        </article>
        <article>
          <span>3</span>
          <div class="body">
            <h2>等待邮件确认</h2>
            <p>提交后等待客服处理，通常 24 小时内会通过邮件确认。</p>

      <footer class="site-footer reveal">

    <div class="floating-actions no-mobile" aria-label="快捷操作">
      <a class="fab-top" href="./index.html#order" title="立即下单">↓</a>
    </div>

    <script>
      const copyButton = document.querySelector(".copy-text");
      const copyTip = document.querySelector(".copy-tip");
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(copyButton.dataset.copy);
          copyTip.textContent = "✓ 已复制，可以粘贴给客服。";
        } catch (e) {
          copyTip.textContent = "复制失败，请手动选择文本。";
        }
        setTimeout(() => { copyTip.textContent = ""; }, 2200);
      });

      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      document.querySelectorAll(".reveal, .reveal-stagger").forEach((el) => io.observe(el));

      const progressBar = document.querySelector(".scroll-progress");
      const updateProgress = () => {
        const h = document.documentElement;
        const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight);
        progressBar.style.width = (scrolled * 100) + "%";
      };
      window.addEventListener("scroll", updateProgress, { passive: true });
      updateProgress();
    </script>
  </body>
